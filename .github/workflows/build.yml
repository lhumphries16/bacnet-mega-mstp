name: build

on:
  push:
  pull_request:

jobs:
  avr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install AVR toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y avr-libc avrdude binutils-avr gcc-avr make

      - name: Fetch pinned bacnet-stack
        run: ./bootstrap_bacnet_stack.sh

      - name: Build
        run: make clean all
